name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Abhängigkeiten für Buildozer installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip python3-venv \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev cmake

      - name: Buildozer und Cython installieren
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          pip install --user --break-system-packages cython==0.29.36 buildozer

      - name: Android APK bauen
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          ~/.local/bin/buildozer -v android debug

      - name: APK-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
